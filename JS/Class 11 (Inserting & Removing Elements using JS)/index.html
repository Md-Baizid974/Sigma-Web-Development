<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inserting & Removing Elements using JS</title>
    <style>
        .red{
            color: red;
        }
    </style>
</head>
<body>
    <div class="container red bg-green">
        <div class="box" style="display: flex;" data-createdby="harry" data-conceptby="Baizid">Hey I am a box1</div>
        <div class="box">Hey I am a box2</div>
    </div>
    <img src="img.png" alt="Code">

    <script>
        // let div = document.createElement("div");
        // div.innerHTML = "I have been inserted <b>by harry</b>"
        // div.setAttribute("class", "created");
        // document.querySelector(".container").append(div)
        let cont = document.querySelector(".container")
        cont.insertAdjacentHTML("afterbegin", "<b>I am under the water. Please help me here too much running...  iuuuoooo<b>")
        // document.querySelector(".box").remove()
        console.log(document.querySelector(".container").classList)
        console.log(document.querySelector(".container").className)
        document.querySelector(".container").classList.add("harry")
        // document.querySelector(".container").classList.remove("red")
        document.querySelector(".container").classList.toggle("red")
    </script>
</body>
</html>
