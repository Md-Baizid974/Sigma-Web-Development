<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms & Input Tags</title>
</head>
<body>
    <form action="post">
        <h1>Form to apply for Sigma Web Development course -TA</h1>
        <div>
            <label for="username">User Name</label>
            <input type="text" name="username" id="username" placeholder="Enter Your Username" autofocus pattern="[a-zA-Z ]+">
        </div>

        <div>
            <input type="radio" name="gender" id="male" value="male">
            <label for="male">Male</label>
            <input type="radio" name="gender" id="female" value="female">
            <label for="female">Female</label>
        </div>

        <div>
            <input type="checkbox" name="subscribe" id="subscribe" value="yes">
            <label for="subscribe">Subscribe to newsletter</label>
        </div>

        <div>
            <label for="comment">Enter Your Comment</label>
            <br>
            <textarea id="comment" name="comment" rows="4" cols="50"></textarea>
        </div>

        <div>
            <select name="fruits">
                <option value="apple">Apple</option>
                <option value="lichi">Lichi</option>
                <option value="cherry">Cherry</option>
            </select>
        </div>
    </form>
</body>
</html>
