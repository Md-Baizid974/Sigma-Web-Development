<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animation</title>
    <style>
        .container{
            background-color: rgb(31, 82, 82);
            height: 80vh;
            width: 30vw;
        }
        .box{
            width: 45px;
            height: 45px;
            background-color: aqua;
            /* animation-name: AmarAnimation;
            animation-duration: 10s;
            animation-iteration-count: infinite;
            animation-timing-function: cubic-bezier(0,0,0,0.96);
            animation-delay: 1s;
            animation-direction: alternate;
            animation-play-state: running; */
            /* animation: name duration timing-function delay iteration-count direction fill-mode; */
            animation: AmarAnimation 5s ease-in-out 3s 1,
                                Next 5s ease-in-out 3s 1;
            border: 2px solid rgb(29, 179, 15);
            border-radius: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
       

        }
        @keyframes AmarAnimation {
            from{
              /* transform: translate(0px); */
              background-color: red;
            }
            to{
                /* transform: translateX(1000px); */
                background-color: yellow;
            }
        }

        @keyframes Next {
            0%{
                transform: rotate(100deg);
            }            
            25%{
                transform: rotate(150deg);
            }
            50%{
                transform: rotate(200deg);
            }
            75%{
                transform: rotate(250deg);
            }
            100%{
                transform: rotate(300deg);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            Box
        </div>
    </div>
</body>
</html>
