<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Position Property</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .parent{
            margin: 34px;
            padding: 43px;
            border: 2px solid black;
            position: relative;
            /* transform, filter, or perspectives can also make an element appear as positioned */
            /* transform: translate(0); */
            /* filter: invert(0); */
            /* perspective: 0em; */
        }
        .box{
            border: 2px solid black;
            height: 433px;
            width: 80vw;
            padding: 3px;
            margin: 3px;
        }
        .box1{
            background-color: aqua;
            /* position: relative;
            z-index: 1; */
            position: sticky;
            top: 0px;
            height: 111px;
            width: 100%;
            margin: 0;
            padding: 0;

        }
        .box2{
            background-color: azure;
            /* position: relative;
            left: 90px;
            top: -60px; */
        }
        .box3{
            background-color: antiquewhite;
            position: absolute;
            top: 0px;
            left: 0px;
        }
        .box4{
            background-color: purple;
            /* position: fixed;
            bottom: 0px;
            left: 8vw;
            height: 111px; */
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box4"></div>
    </div>
</body>
</html>
