<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Shadows & Outlines</title>
    <style>
        .box{
            border: 2px solid black;
            padding: 34px;
            box-shadow: 5px 15px 5px #888888;
        }

        .text-element{
            text-shadow: 10px 5px 3px rgb(170, 2, 248);
            outline: 2px solid black;
            border: 2px solid green;
            border-radius: 8px;
            outline-offset: 19px;
        }
    </style>
</head>
<body>
    <div class="box">
        I am a box
    </div>
    <p class="text-element">Lorem ipsum dolor sit, amet consectetur adipisicing elit. Quidem mollitia recusandae ea facere deserunt consequuntur necessitatibus sunt sint dolores vitae aut nemo, velit libero ad esse optio! Ad atque voluptates iusto vitae sequi minima.</p>
</body>
</html>
