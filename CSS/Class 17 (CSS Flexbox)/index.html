<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Flexbox</title>
    <style>
        .container{
            border: 2px solid red;
            display: flex;
            height: 80vh;
            /* there is no justify-items in flexbox */
            /* justify-content: center; */
            
            /* for single line it's align-items and for multiple line it's align-content */
            align-items: center;
            /* align-content: flex-start; */
            /* flex-direction: column; */
            flex-wrap: wrap;
            flex-flow: row wrap;
            /* gap: 30px;
            row-gap: 40px;
            column-gap: 20px; */
            gap: 10px 40px;
        }
        .item{
            /* flex-grow: 1; */
            height: 92px;
            width: 92px;
            border: 2px solid black;
            /* margin: 4px; */
            background-color: blueviolet;
        }
        .item1{
            /* flex-grow: 2; */
            /* flex-shrink: 2; */
            align-self: flex-end;
        }
        .order-1{
            order: 1;
        }
        .order-2{
            order: 2;
        }
        .order-3{
            order: 3;
        }
    </style>
</head>
<body>
    <main>
        <img src="Flexbox.png" alt="Main axis & Cross axis">
        <img src="fb.png" alt="Image">
        <div class="container">
            <div class="item item1">1</div>
            <div class="item">2</div>
            <div class="item">3</div>
            <div class="item order-1">4</div>
            <div class="item"></div>
            <!-- <div class="item"></div> -->
            <!-- <div class="item"></div> -->
            <!-- <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div> -->
            <div class="item"></div>
            <div class="item"></div>
            <div class="item order-3">66</div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
        </div>
    </main>
</body>
</html>
