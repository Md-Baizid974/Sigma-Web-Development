<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Filters</title>
    <style>
        /* img{
            filter: blur(10px);
        } */
        
        .img1{
            filter: brightness(122%) contrast(2);
        }

        .img2{
            /* filter: invert(1); */
            filter: opacity(0.5);
        }

        .img3{
            filter: grayscale(100%);
            /* filter: sepia(100%); */
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="img1" src="https://img.magnific.com/free-photo/programming-background-with-person-working-with-codes-computer_23-2150010125.jpg" alt="">
        <img class="img2" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTnSvbMDjat3lsWS0cU91CmnWLrg5GLygrqnSS-9IJGCQtFm2ruPZG0Rib7&s=10" alt="">
        <img class="img3" src="https://cdn.britannica.com/91/267391-050-9025A36D/indian-actor-akshay-kumar-red-sea-international-film-festival-december-2022.jpg" alt="">
    </div>
</body>
</html>
