<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors</title>
    <style>
        /* Element Selector */
        div {
            background-color: red;
        }
       /* Class Selector  */
       .red{
        background-color: yellow;
       }
       /* Id Selector  */
       #one {
        background-color: green;
       }
       /* Descendant Selector  */
       div p {
        background-color: purple;
       }
       /* Child Selector  */
       div > p {
        background-color: blue;
       }
       /* Universal Selector  */
       *{
        margin: 0;
        padding: 0;
       }
       /* Pseudo Selector  */
       a:visited{
        color: yellow;
       }
       a:link{
        color: green;
       }
       a:active{
        background-color: red;
       }
       a:hover{
        background-color: yellow;
       }
       p:first-child{
        background-color: aqua;
       }
    </style>
</head>
<body>
    <h1>What is CSS Selectors?</h1>
    <p>CSS selectors allows to choose specific elements and apply styles to them.</p>
    <div>Element Selector</div>
    <div class="red">Class Selector</div>
    <div id="one">ID Selector</div>
    <div><article><p>Descendant Selector</p></article></div>
    <div><p>Child Selector</p></div>
    <a href="https://www.google.com">Go to Google</a>
    <main class="one">
        <p>I am first</p>
        <p>I am second</p>
    </main>
</body>
</html>
