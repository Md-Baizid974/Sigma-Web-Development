<html lang="en">
<head>

    <title>CSS Display Property</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box{
            border: 2px solid blue;
            display: inline-block;
            width: 344px;
            padding: 45px;
            margin: 34px;
        }

            display: none;
            visibility: hidden;
        }
    </style> */
</head>
<body>
    <div class="box box1">
        I am a box
    </div>
    <div class="box">also a nice box</div>

    <span>I am a good</span>
    <span>boy</span>
    <pre style="font-family: 'Times New Roman', Times, serif; line-height: 1.5;">Margin: It is not applicable for inline element. 
Width: It is also not applicable for inline element. 
So, we need to inline-block.
